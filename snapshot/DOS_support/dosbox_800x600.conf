[sdl]
fullscreen=false
output=opengl
windowresolution=800x600
fullresolution=desktop
[render]
aspect=true
scaler=none
[dosbox]
memsize=32
[cpu]
cycles=max
[mixer]
nosound=false
rate=44100
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
[autoexec]
mount c "."
c:
set BLASTER=A220 I7 D1 H5 T6
ULTIHF99.EXE
