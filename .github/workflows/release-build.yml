name: Build Windows and DOS installers from GitHub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'snapshot/**'
      - 'assets/**'
      - 'installer/**'
      - 'ci/**'
      - '.github/workflows/release-build.yml'
  release:
    types: [published]

concurrency:
  group: ultima1-source-build-and-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install clean build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-mingw-w64-x86-64 curl unzip bzip2
      - name: Compile both games from repository sources
        run: bash ci/build_sources.sh
      - name: Verify absence of original commercial data
        run: |
          test -s dist/stage-win/Ultima1KR.exe
          test -s dist/stage-dos/ULTIHF99.EXE
          test ! -d dist/stage-win/GAMEDATA
          test ! -d dist/stage-dos/GAMEDATA
          test ! -d dist/stage-win/SAVEGAME
          test ! -d dist/stage-dos/SAVEGAME
      - uses: actions/upload-artifact@v4
        with:
          name: source-built-windows-stage
          path: dist/stage-win/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: source-built-dos-stage
          path: dist/stage-dos/
          if-no-files-found: error
          retention-days: 30

  installers:
    needs: compile
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-built-windows-stage
          path: dist/stage-win/
      - uses: actions/download-artifact@v4
        with:
          name: source-built-dos-stage
          path: dist/stage-dos/
      - name: Build installers and test archives
        shell: pwsh
        run: ./ci/package_installers.ps1
      - name: Smoke-test DOS installer and preserve existing saves
        shell: pwsh
        run: ./ci/verify_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Ultima1K-Windows-DOS-Installers-7z
          path: dist/release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish persistent rolling source-build release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = 'v1.0K-source-build'
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GH_REPO --target $env:GITHUB_SHA --title 'Ultima I Korean 1.0K - GitHub source build (candidate)' --notes 'Automated Windows/DOS builds from a clean GitHub checkout. Requires separately licensed original Ultima I game files. These binaries are new build candidates, not the previously antivirus-approved hashes.' --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not create rolling GitHub release' }
          }
          gh release upload $tag 'dist/release/Ultima1K(Win)_Setup.7z' 'dist/release/Ultima1K(DOS)_Setup.7z' 'dist/release/SHA256SUMS.txt' --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
      - name: Publish versioned release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          gh release upload $env:TAG "dist/release/Ultima1K(Win)_Setup.7z" "dist/release/Ultima1K(DOS)_Setup.7z" "dist/release/SHA256SUMS.txt" --clobber
